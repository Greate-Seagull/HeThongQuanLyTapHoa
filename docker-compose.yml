version: '3.8'

services:
  # Backend Server (Node.js + Express + Prisma)
  # Uses AWS RDS database from server/.env
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: grocery-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3001
    ports:
      - "3000:3000"
    networks:
      - grocery-network
    volumes:
      - ./server/prisma:/app/prisma
    command: sh -c "npx prisma generate && npm start"

  # Frontend Client (Next.js)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: grocery-client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      - server
    networks:
      - grocery-network

networks:
  grocery-network:
    driver: bridge
